name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and upload release artifacts
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python relay dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\relay\python\requirements-dev.txt

      - name: Build artifacts
        shell: pwsh
        env:
          DESKFERRY_ANDROID_KEYSTORE_BASE64: ${{ secrets.DESKFERRY_ANDROID_KEYSTORE_BASE64 }}
          DESKFERRY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DESKFERRY_ANDROID_KEYSTORE_PASSWORD }}
          DESKFERRY_ANDROID_KEY_ALIAS: ${{ secrets.DESKFERRY_ANDROID_KEY_ALIAS }}
          DESKFERRY_ANDROID_KEY_PASSWORD: ${{ secrets.DESKFERRY_ANDROID_KEY_PASSWORD }}
        run: |
          .\build\build-go.ps1
          .\build\build-windows.ps1 -SkipGoBuild
          .\build\build-go.ps1 -DebugWindows -DebugArtifactSuffix
          .\build\build-windows.ps1 -DebugWindows -DebugArtifactSuffix -SkipGoBuild
          .\build\build-azure-relay.ps1
          .\build\build-python-relay.ps1
          if ([string]::IsNullOrWhiteSpace($env:DESKFERRY_ANDROID_KEYSTORE_BASE64)) { throw 'Android release signing keystore secret is missing' }
          $env:DESKFERRY_ANDROID_KEYSTORE = Join-Path $env:RUNNER_TEMP 'deskferry-android-release.jks'
          [IO.File]::WriteAllBytes($env:DESKFERRY_ANDROID_KEYSTORE, [Convert]::FromBase64String($env:DESKFERRY_ANDROID_KEYSTORE_BASE64))
          $env:DESKFERRY_ANDROID_EXPECT_SIGNED = '1'
          .\build\build-android-home.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $files = @(
            'dist\bin\deskferry-windows-amd64.exe',
            'dist\bin\deskferry-windows-amd64-debug.exe',
            'dist\bin\deskferry-home-macos-arm64',
            'dist\bin\deskferry-home-macos-amd64',
            'dist\bin\deskferry-relay-linux-amd64',
            'dist\azure-relay\deskferry-azure-relay.zip',
            'dist\python-relay\deskferry-python-relay.zip',
            'dist\python-relay\deskferry-python-relay-linux-cp39-vendored.zip',
            'dist\android\deskferry-home-android-debug.apk'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "missing release artifact: $file"
            }
          }
          $lines = Get-FileHash $files -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $((Resolve-Path -LiteralPath $_.Path -Relative) -replace '^\.\\','')"
          }
          $lines | Set-Content -LiteralPath 'dist\bin\SHA256SUMS.txt' -Encoding ascii

      - name: Create release if needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.tag }}'
          gh release upload $tag `
            'dist\azure-relay\deskferry-azure-relay.zip' `
            'dist\python-relay\deskferry-python-relay.zip' `
            'dist\python-relay\deskferry-python-relay-linux-cp39-vendored.zip' `
            'dist\android\deskferry-home-android-debug.apk' `
            'dist\bin\deskferry-windows-amd64.exe' `
            'dist\bin\deskferry-windows-amd64-debug.exe' `
            'dist\bin\deskferry-home-macos-arm64' `
            'dist\bin\deskferry-home-macos-amd64' `
            'dist\bin\deskferry-relay-linux-amd64' `
            'dist\bin\SHA256SUMS.txt' `
            --clobber
