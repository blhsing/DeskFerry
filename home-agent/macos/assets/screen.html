<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DeskFerry Screen Viewer</title>
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/screen.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-camera" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h1.6l1-1.5h3.8l1 1.5h1.6A1.5 1.5 0 0 1 14 5.5v6a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/><circle cx="8" cy="8.5" r="2.3"/></g></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><path d="M4 8h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 4v8M4 8h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-fit" viewBox="0 0 16 16"><path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-full" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-save" viewBox="0 0 16 16"><path d="M8 2.5v7.5M4.8 7l3.2 3.2L11.2 7M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="bar">
  <div class="toolbar" role="toolbar" aria-label="Screen viewer controls">
    <div class="brand"><img src="static/icon.svg" alt=""><span>Work screen</span></div>

    <div class="seg" role="group" aria-label="Capture">
      <button type="button" id="captureBtn" title="Capture one screenshot"><svg class="ico"><use href="#i-camera"/></svg><span class="lbl">Capture once</span></button>
      <button type="button" id="streamBtn" title="Start a live stream"><svg class="ico"><use href="#i-play"/></svg><span class="lbl">Start stream</span></button>
      <button type="button" id="stopBtn" title="Stop the stream"><svg class="ico"><use href="#i-stop"/></svg><span class="lbl">Stop</span></button>
    </div>

    <label class="select" title="Stream refresh interval">
      <span class="sr-only">Stream interval</span>
      <select id="interval" aria-label="Stream interval">
        <option value="500">Every 0.5 s</option>
        <option value="1000" selected>Every 1 s</option>
        <option value="2000">Every 2 s</option>
        <option value="5000">Every 5 s</option>
      </select>
    </label>

    <div class="seg zoom" role="group" aria-label="Zoom">
      <button type="button" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg class="ico"><use href="#i-minus"/></svg></button>
      <input id="zoom" value="Auto Fit" list="zoom-levels" aria-label="Zoom level" spellcheck="false">
      <button type="button" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg class="ico"><use href="#i-plus"/></svg></button>
      <button type="button" id="fitBtn" title="Auto fit to window"><svg class="ico"><use href="#i-fit"/></svg><span class="lbl">Fit</span></button>
    </div>
    <datalist id="zoom-levels"><option>Auto Fit</option><option>25%</option><option>50%</option><option>75%</option><option>100%</option><option>125%</option><option>150%</option><option>200%</option><option>300%</option><option>400%</option></datalist>

    <div class="seg" role="group" aria-label="View">
      <button type="button" id="fullBtn" title="Full screen" aria-label="Full screen"><svg class="ico"><use href="#i-full"/></svg></button>
      <a id="save" class="btn" href="api/screen/frame.png" download="DeskFerry-Screenshot.png" title="Save the current frame as PNG"><svg class="ico"><use href="#i-save"/></svg><span class="lbl">Save PNG</span></a>
    </div>

    <span class="spacer"></span>
    <span class="chip" id="statusChip" role="status"><span id="statusWord">Ready</span></span>
  </div>
</header>

<div id="view">
  <div id="stage" class="fit"><img id="image" draggable="false" alt="Work computer screen"></div>
  <div class="empty" id="empty">
    <div class="spinner" aria-hidden="true"></div>
    <p id="emptyText">Capturing the Work computer screen…</p>
  </div>
</div>
<p class="status-line" id="status" aria-live="polite">Ready</p>

<script src="static/screen.js"></script>
</body>
</html>
